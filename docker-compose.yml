version: "3.9"

services:
  backend: 
    build: ./server
    ports:
      - "5000:5000"
    container_name: backend_service
    env_file:
      - ./backend/.env
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend/react-app
      target: production
    ports:
      - "80:80"
    container_name: frontend_service
    networks:
      - app-network
    env_file:
      - ./frontend/react-app/.env
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge
