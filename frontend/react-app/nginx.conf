server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /assets {      
      access_log off;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;

    }
    location =/index.html{
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    index index.html;
    location / {        
        try_files $uri /index.html;
    }

   

}
